name: Build unsigned IPA

# 没有 Mac 也能拿到 ipa：在 GitHub Actions 的 macOS 机器上编译，
# 产出"未签名 ipa"，再用 Sideloadly / AltStore 用你自己的 Apple ID 签名安装。

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write      # 发布 Release 需要写权限

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project WhiteScreenTimer.xcodeproj \
            -scheme WhiteScreenTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/WhiteScreenTimer.app Payload/
          zip -qr WhiteScreenTimer-unsigned.ipa Payload
          ls -lh WhiteScreenTimer-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiteScreenTimer-unsigned-ipa
          path: WhiteScreenTimer-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: 自动夜灯 v1.1.2
          make_latest: true
          files: WhiteScreenTimer-unsigned.ipa
          body: |
            ## 自动夜灯 v1.1.2（未签名 ipa）

            ### 本版修复
            - **三个模式的「常亮」互相干扰**：夜灯用自己的独立开关（会记住上次选择），警灯与摩斯求救固定常亮且开关置灰，切换模式不再把夜灯的常亮改掉。

            ### 应急模式（默认常亮，不自动退出）
            - **警灯模式**：**仅屏幕**红红-蓝蓝交替爆闪（1 秒一循环），不动用闪光灯
            - **摩斯求救模式**：循环播放 SOS 电码（三短 — 三长 — 三短）；可选 **仅屏幕闪烁** 或 **屏幕 + 手机闪光灯同时闪**

            ### 原有功能
            - 启动 1.5 秒渐变到最亮；到点后 5 秒过渡（亮度渐变 + 画面压暗）再退出
            - 屏幕色调：纯白 + 7 个暖色预设，支持 RGB 自定义（仅夜灯模式）
            - 退出时间 1–10 分钟可选，默认 3 分钟
            - 长按屏幕 1.2 秒进入设置

            ### 权限说明
            只有摩斯模式选「屏幕 + 闪光灯」时才需要相机权限；「仅屏幕闪烁」不申请权限。

            ### 安装（ipa 未签名，必须自签）
            1. Windows 上用 **Sideloadly**，把 ipa 拖入，填自己的 Apple ID，连接 iPhone 点 Start
            2. iPhone：设置 → 通用 → VPN 与设备管理 → 信任开发者证书
            3. iOS 16+：设置 → 隐私与安全性 → 开发者模式 → 打开并重启

            免费 Apple ID 签名 7 天有效，到期用同一工具重签即可。

            ### 系统要求
            iOS 16.0 及以上（arm64）
